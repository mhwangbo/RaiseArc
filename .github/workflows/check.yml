name: Candidate checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Check candidate file scope and GUIDs
        run: node Tools/check_candidate.cjs
      - name: Install docs dependencies
        working-directory: website
        run: npm ci --no-audit --no-fund
      - name: Build both documentation locales
        working-directory: website
        run: npm run build

# Unity compilation, tests, Windows player, migration, and release packaging are
# explicit manual gates until a licensed, isolated runner is configured.
# This workflow has no publication or deployment permissions.
